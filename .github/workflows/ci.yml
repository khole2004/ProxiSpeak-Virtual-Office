name: ProxiSpeak CI / CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Automated Tests, Benchmark & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: 📦 Install root project dependencies
        run: npm install

      - name: 📦 Install client dependencies
        run: npm --prefix client install

      - name: 📦 Install server dependencies
        run: npm --prefix server install

      - name: 🧪 Run Automated Integration & Proximity Audio Tests
        run: npm test

      - name: ⚡ Run High-Density Spatial Audio Performance Benchmark
        run: npm run benchmark

      - name: 🛡️ Verify Server Code Integrity
        run: node --check server/src/server.js

      - name: 🏗️ Build Production Client Application
        run: npm --prefix client run build

      - name: 🏗️ Build Production Root SPA Bundle
        run: npm run build
